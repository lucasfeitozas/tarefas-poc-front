name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx ng test --watch=false
      # base-href relativo: o mesmo build funciona servido na raiz (E2E) e em /tarefas-poc-front/ (Pages).
      - run: npx ng build --base-href ./

      - uses: actions/upload-artifact@v4
        with:
          name: tarefas-front-dist
          path: dist/tarefas-poc-front/browser
          retention-days: 7

  e2e:
    name: Validação E2E (tarefas-poc-cypress)
    needs: build
    uses: lucasfeitozas/tarefas-poc-cypress/.github/workflows/e2e.yml@main
    with:
      app-artifact: tarefas-front-dist

  deploy:
    name: Deploy no GitHub Pages
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarefas-front-dist
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
